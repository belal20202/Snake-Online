name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build Snake Arab Online APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_HOME"
          test -f "$ANDROID_HOME/platform-tools/adb"
          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"

          echo "Android SDK OK"
          adb version

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        shell: bash
        run: |
          set -e
          godot --version

      - name: Create Debug Keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          rm -f "$HOME/.android/debug.keystore"

          keytool \
            -genkeypair \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -deststoretype PKCS12

          test -f "$HOME/.android/debug.keystore"

          echo "Debug keystore OK"

      - name: Configure Godot Android
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"

          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          echo "Godot Android configuration:"
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Verify Project Files
        shell: bash
        run: |
          set -e

          test -f project.godot
          test -f export_presets.cfg

          echo "project.godot OK"
          echo "export_presets.cfg OK"

      - name: Verify Android Preset
        shell: bash
        run: |
          set -e

          grep -q 'name="Android"' export_presets.cfg
          grep -q 'platform="Android"' export_presets.cfg

          echo "Android preset OK"

      - name: Verify Export Templates
        shell: bash
        run: |
          set -e

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.5.1.stable"

          echo "Checking:"
          echo "$TEMPLATE_DIR"

          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

          echo "Android export templates OK"

      - name: Import Godot Project
        shell: bash
        run: |
          set -e

          godot \
            --headless \
            --path "." \
            --editor \
            --quit

          echo "Project imported successfully."

      - name: Prepare Build
        shell: bash
        run: |
          set -e

          mkdir -p build
          rm -f build/SnakeArabOnline.apk

      - name: Check Android Environment
        shell: bash
        run: |
          set -e

          echo "========== JAVA =========="
          java -version

          echo ""
          echo "========== ANDROID SDK =========="
          echo "$ANDROID_HOME"

          echo ""
          echo "========== ADB =========="
          adb version

          echo ""
          echo "========== APKSIGNER =========="
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" --version

          echo ""
          echo "========== KEYSTORE =========="
          ls -lh "$HOME/.android/debug.keystore"

      - name: Build APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ env.HOME }}/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -e

          echo "======================================"
          echo "Starting Android APK export"
          echo "======================================"

          godot \
            --headless \
            --path "." \
            --verbose \
            --export-debug \
            "Android" \
            "build/SnakeArabOnline.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -e

          if [ ! -f "build/SnakeArabOnline.apk" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          if [ ! -s "build/SnakeArabOnline.apk" ]; then
            echo "ERROR: APK is empty."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh build/SnakeArabOnline.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SnakeArabOnline-APK
          path: build/SnakeArabOnline.apk
          if-no-files-found: error
          retention-days: 30
