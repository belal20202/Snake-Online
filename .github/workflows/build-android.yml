name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build Snake Arab Online APK
    runs-on: ubuntu-latest

    steps:

      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت مكونات Android
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: تثبيت Godot 4.5.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-export-templates: true

      - name: التحقق من ملفات المشروع
        shell: bash
        run: |
          set -e

          if [ ! -f "project.godot" ]; then
            echo "❌ لم يتم العثور على project.godot"
            exit 1
          fi

          if [ ! -f "export_presets.cfg" ]; then
            echo "❌ لم يتم العثور على export_presets.cfg"
            exit 1
          fi

          echo "✅ ملفات المشروع موجودة"

      - name: التحقق من Android Export Preset
        shell: bash
        run: |
          set -e

          grep -q 'name="Android"' export_presets.cfg
          grep -q 'platform="Android"' export_presets.cfg

          echo "✅ Android Export Preset موجود"

      - name: فحص مشروع Godot
        shell: bash
        run: |
          set -e

          godot \
            --headless \
            --path "." \
            --editor \
            --quit

          echo "✅ فحص Godot اكتمل"

      - name: إنشاء مجلد APK
        shell: bash
        run: |
          mkdir -p build
          rm -f build/SnakeArabOnline.apk

      - name: بناء APK
        shell: bash
        run: |
          set -e

          godot \
            --headless \
            --path "." \
            --export-debug \
            "Android" \
            "build/SnakeArabOnline.apk"

      - name: التأكد من إنشاء APK
        shell: bash
        run: |
          set -e

          if [ ! -s "build/SnakeArabOnline.apk" ]; then
            echo "❌ فشل إنشاء APK"
            exit 1
          fi

          echo "================================="
          echo "✅ تم إنشاء APK بنجاح"
          echo "================================="

          ls -lh build/SnakeArabOnline.apk

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: SnakeArabOnline-APK
          path: build/SnakeArabOnline.apk
          if-no-files-found: error
          retention-days: 14
