name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: write

jobs:
  build:
    name: Build Snake Arab Online APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"


      - name: Setup Godot 4.5.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true


      - name: Verify project
        run: |
          test -f project.godot
          test -f export_presets.cfg

          echo "Project OK"


      - name: Verify Android preset
        run: |
          grep -q 'name="Android"' export_presets.cfg
          grep -q 'platform="Android"' export_presets.cfg

          echo "Android preset OK"


      - name: Import Godot project
        run: |
          godot \
            --headless \
            --path "." \
            --editor \
            --quit


      - name: Create build folder
        run: |
          mkdir -p build
          rm -f build/SnakeArabOnline.apk


      - name: Build APK
        run: |
          godot \
            --headless \
            --path "." \
            --export-debug \
            "Android" \
            "build/SnakeArabOnline.apk"


      - name: Verify APK
        run: |
          if [ ! -f "build/SnakeArabOnline.apk" ]; then
            echo "❌ APK was not created"
            exit 1
          fi

          if [ ! -s "build/SnakeArabOnline.apk" ]; then
            echo "❌ APK is empty"
            exit 1
          fi

          echo "✅ APK CREATED"
          ls -lh build/SnakeArabOnline.apk


      # رفع APK كملف يمكن تحميله من GitHub Actions
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnakeArabOnline-APK
          path: build/SnakeArabOnline.apk
          if-no-files-found: error
          retention-days: 30


      # نسخ APK إلى مجلد خاص داخل الـRunner
      - name: Prepare APK for release
        run: |
          mkdir -p release
          cp build/SnakeArabOnline.apk release/SnakeArabOnline.apk


      # إنشاء Release تلقائي
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Snake Arab Online v1.0.${{ github.run_number }}
          body: |
            Snake Arab Online
            إصدار Android
            المطور: بلال النعيمي
            سنة الإصدار: 2026
          files: release/SnakeArabOnline.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
