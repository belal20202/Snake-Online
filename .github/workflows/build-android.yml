name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build Snake Arab Online APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Setup Godot 4.5.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        shell: bash
        run: |
          set -e

          godot --version

          echo "Godot installed successfully."

      - name: Verify project files
        shell: bash
        run: |
          set -e

          test -f project.godot
          test -f export_presets.cfg

          echo "Project files found."

      - name: Verify Android preset
        shell: bash
        run: |
          set -e

          grep -q 'name="Android"' export_presets.cfg
          grep -q 'platform="Android"' export_presets.cfg

          echo "Android preset found."

      - name: Verify Android export templates
        shell: bash
        run: |
          set -e

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.5.1.stable"

          echo "Checking:"
          echo "$TEMPLATE_DIR"

          if [ ! -f "$TEMPLATE_DIR/android_debug.apk" ]; then
            echo "ERROR: android_debug.apk not found."
            echo "Installed export templates:"
            find "$HOME/.local/share/godot" -type f -name "android_debug.apk" -o -name "android_release.apk" || true
            exit 1
          fi

          if [ ! -f "$TEMPLATE_DIR/android_release.apk" ]; then
            echo "ERROR: android_release.apk not found."
            exit 1
          fi

          echo "Android export templates found."

      - name: Import Godot project
        shell: bash
        run: |
          set -e

          godot \
            --headless \
            --path "." \
            --editor \
            --quit

          echo "Godot project imported successfully."

      - name: Create build directory
        shell: bash
        run: |
          set -e

          mkdir -p build
          rm -f build/SnakeArabOnline.apk

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          godot \
            --headless \
            --path "." \
            --export-debug \
            "Android" \
            "build/SnakeArabOnline.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -e

          if [ ! -f "build/SnakeArabOnline.apk" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          if [ ! -s "build/SnakeArabOnline.apk" ]; then
            echo "ERROR: APK is empty."
            exit 1
          fi

          echo "======================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh build/SnakeArabOnline.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SnakeArabOnline-APK
          path: build/SnakeArabOnline.apk
          if-no-files-found: error
          retention-days: 14
