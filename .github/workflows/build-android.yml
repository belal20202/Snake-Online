name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build Snake Arab Online APK
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------
      # 1. تحميل المشروع
      # -----------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # -----------------------------------------
      # 2. Java 17
      # -----------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # -----------------------------------------
      # 3. Android SDK
      # -----------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # -----------------------------------------
      # 4. تثبيت Android SDK
      # -----------------------------------------
      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          sdkmanager --licenses <<EOF || true
          y
          y
          y
          y
          y
          y
          y
          y
          EOF

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"


      # -----------------------------------------
      # 5. فحص Android SDK
      # -----------------------------------------
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          test -d "$ANDROID_HOME"

          test -f "$ANDROID_HOME/platform-tools/adb"

          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"

          echo "Android SDK OK"

          "$ANDROID_HOME/platform-tools/adb" version


      # -----------------------------------------
      # 6. إنشاء Debug Keystore
      # -----------------------------------------
      - name: Create Android Debug Keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          keytool \
            -genkeypair \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -deststoretype PKCS12

          test -f "$HOME/.android/debug.keystore"

          echo "Debug keystore created."


      # -----------------------------------------
      # 7. إعداد Godot Editor Settings
      # -----------------------------------------
      - name: Configure Godot Android Settings
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"

          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"

          export/android/sdk_path = "$ANDROID_HOME"
          EOF

          echo "Godot Android settings created."

          cat "$HOME/.config/godot/editor_settings-4.tres"


      # -----------------------------------------
      # 8. تثبيت Godot
      # -----------------------------------------
      - name: Setup Godot 4.5.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true


      # -----------------------------------------
      # 9. فحص Godot
      # -----------------------------------------
      - name: Verify Godot
        shell: bash
        run: |
          set -e

          godot --version

          echo "Godot OK"


      # -----------------------------------------
      # 10. فحص ملفات المشروع
      # -----------------------------------------
      - name: Verify Project
        shell: bash
        run: |
          set -e

          test -f project.godot

          test -f export_presets.cfg

          echo "project.godot OK"
          echo "export_presets.cfg OK"


      # -----------------------------------------
      # 11. فحص Android Preset
      # -----------------------------------------
      - name: Verify Android Preset
        shell: bash
        run: |
          set -e

          grep -q 'name="Android"' export_presets.cfg

          grep -q 'platform="Android"' export_presets.cfg

          echo "Android preset OK"


      # -----------------------------------------
      # 12. فحص Export Templates
      # -----------------------------------------
      - name: Verify Export Templates
        shell: bash
        run: |
          set -e

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.5.1.stable"

          echo "Templates:"
          echo "$TEMPLATE_DIR"

          if [ ! -f "$TEMPLATE_DIR/android_debug.apk" ]; then
            echo "ERROR: android_debug.apk not found."

            find "$HOME/.local/share/godot" \
              -type f \
              \( -name "android_debug.apk" -o -name "android_release.apk" \) \
              -print || true

            exit 1
          fi

          if [ ! -f "$TEMPLATE_DIR/android_release.apk" ]; then
            echo "ERROR: android_release.apk not found."
            exit 1
          fi

          echo "Android export templates OK."


      # -----------------------------------------
      # 13. Import المشروع
      # -----------------------------------------
      - name: Import Godot Project
        shell: bash
        run: |
          set -e

          godot \
            --headless \
            --path "." \
            --editor \
            --quit

          echo "Godot project imported."


      # -----------------------------------------
      # 14. إنشاء مجلد Build
      # -----------------------------------------
      - name: Prepare Build
        shell: bash
        run: |
          set -e

          mkdir -p build

          rm -f build/SnakeArabOnline.apk

          echo "Build directory ready."


      # -----------------------------------------
      # 15. اختبار إعدادات Android قبل التصدير
      # -----------------------------------------
      - name: Check Android Export Configuration
        shell: bash
        run: |
          set -e

          echo "Java:"
          java -version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ADB:"
          adb version

          echo ""
          echo "Debug keystore:"
          ls -lh "$HOME/.android/debug.keystore"

          echo ""
          echo "Build tools:"
          ls -lh "$ANDROID_HOME/build-tools/35.0.0/apksigner"

          echo ""
          echo "Android configuration looks ready."


      # -----------------------------------------
      # 16. بناء APK
      # -----------------------------------------
      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Starting Android APK export"
          echo "======================================"

          godot \
            --headless \
            --path "." \
            --verbose \
            --export-debug \
            "Android" \
            "build/SnakeArabOnline.apk"


      # -----------------------------------------
      # 17. التأكد من APK
      # -----------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          if [ ! -f "build/SnakeArabOnline.apk" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          if [ ! -s "build/SnakeArabOnline.apk" ]; then
            echo "ERROR: APK is empty."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "       APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh build/SnakeArabOnline.apk


      # -----------------------------------------
      # 18. رفع APK
      # -----------------------------------------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnakeArabOnline-APK
          path: build/SnakeArabOnline.apk
          if-no-files-found: error
          retention-days: 30
